name: Polypheny-DB Adapter Matrix CI

on:
    push:
    pull_request:
        types: [ opened, synchronize, reopened, ready_for_review ]

jobs:
    build:
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                adapter: [ mongodb, hsqldb, monetdb, postgresql, file, neo4j ]
        name: ${{ matrix.adapter }}
        steps:
            -   name: Checkout
                uses: actions/checkout@v5
            -   name: Set up JDK
                uses: actions/setup-java@v5
                with:
                    distribution: 'temurin'
                    java-version: 21
                    cache: gradle
            -   name: Set env variable
                run: |
                    echo "POLYPHENY_HOME=$GITHUB_WORKSPACE" >> $GITHUB_ENV
            -   name: Print Java Version
                timeout-minutes: 5
                run: |
                    gradle_log="$(mktemp)"
                    trap 'rm -f "$gradle_log"' EXIT
                    if ./gradlew printJavaVersion --console=plain > "$gradle_log" 2>&1; then
                        cat "$gradle_log"
                    else
                        gradle_status=$?
                        cat "$gradle_log"
                        if ! grep -Fq 'Received status code 429 from server' "$gradle_log"; then
                            exit "$gradle_status"
                        fi
                        echo "Gradle dependency download was rate-limited. Retrying in 60 seconds."
                        sleep 60
                        ./gradlew printJavaVersion --console=plain
                    fi
            -   name: Assemble
                timeout-minutes: 10
                run: ./gradlew assemble -PwithoutpullingUi=true
            -   name: Build Plugins
                timeout-minutes: 5
                run: ./gradlew assemblePlugins -PwithoutpullingUi=true
            -   name: Set up JDBC test dependency
                id: jdbc
                uses: ./.github/actions/setup-test-jdbc
            -   name: Execute integration tests for ${{ matrix.adapter }}
                timeout-minutes: 30
                run: ./gradlew "-Dmaven.repo.local=${{ steps.jdbc.outputs.maven-dir }}" integrationTests -Dstore.default=${{ matrix.adapter }} -PwithoutpullingUi=true
