plugins {
    id 'java'
    id "com.google.protobuf" version "$protobuf_plugin_version"
}


apply plugin: "com.google.protobuf"

group "org.polypheny"

configurations {
    prismProtocolSource
    tests {
        extendsFrom testRuntimeOnly
    }
}

repositories {
    mavenCentral()
    ivy {
        url 'https://github.com/polypheny/Polypheny-Prism-API/archive'
        patternLayout { artifact '[revision].[ext]' }
        metadataSources { artifact() }
        content { includeModule('org.polypheny', 'prism-source') }
    }
}

// Pin the companion protocol change until its next Maven release. The source
// archive is immutable; local protocol development can use -PprismApiDirectory.
def prismApiRevision = 'ac57da2459071234c4cacc6836e3f4ca6f13f101'
def prismApiDirectory = providers.gradleProperty('prismApiDirectory')
def protocolSources = layout.buildDirectory.dir('prism-protocol')

tasks.register('preparePrismProtocol', Sync) {
    dependsOn tasks.named('extractIncludeProto')
    // Keep the released wire representation of values/frames. The API main
    // branch also contains unrelated protocol changes; overlay only this RPC.
    from('build/extracted-include-protos/main') {
        include 'org/polypheny/prism/*.proto'
        exclude 'org/polypheny/prism/namespace_meta_responses.proto'
    }
    if (prismApiDirectory.isPresent()) {
        from(prismApiDirectory.get()) { include 'org/polypheny/prism/namespace_meta_responses.proto' }
    } else {
        from({ zipTree(configurations.prismProtocolSource.singleFile) }) {
            include '*/org/polypheny/prism/namespace_meta_responses.proto'
            eachFile { path = path.substring(path.indexOf('/') + 1) }
            includeEmptyDirs = false
        }
    }
    into protocolSources
}

dependencies {
    compileOnly project(path: ':core')
    compileOnly project(path: ':dbms')
    compileOnly project(path: ':plugins:sql-language')
    compileOnly project(path: ':plugins:mql-language')

    // Prism API files (protobuf files), needs to be implementation due to the prism-api-version.properties
    implementation group: 'org.polypheny', name: 'prism', version: prism_api_version
    prismProtocolSource "org.polypheny:prism-source:${prismApiRevision}@zip"

    // Protobuf
    implementation group: 'com.google.protobuf', name: 'protobuf-java', version: protobuf_version


    // --- Test Compile ---
    testImplementation project(path: ':dbms', configuration: 'test')
    testImplementation project(path: ':core', configuration: 'tests')
    testImplementation project(path: ':core')
    testImplementation project(path: ':dbms')
    testImplementation(group: "org.polypheny", name: "polypheny-jdbc-driver", version: polypheny_jdbc_driver_version) {
        exclude(group: "com.fasterxml.jackson.core")
    }  // Apache 2.0

}

// compile protos on build
compileJava.dependsOn(generateProto)
compileTestJava.mustRunAfter(javadoc)
compileTestJava.mustRunAfter(jar)
compileTestJava.mustRunAfter(plugin)
processResources.dependsOn(extractIncludeProto)
processResources.dependsOn(preparePrismProtocol)

test.dependsOn(":dbms:shadowJar")

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobuf_version}"
    }

    generateProtoTasks {
        all().each { task ->
            task.dependsOn tasks.named('preparePrismProtocol')
            task.builtins {
                java {}
            }
        }
    }
}

sourceSets {
    main {
        java {
            srcDirs = ["src/main/java", "build/generated/source/proto/main/java"]
        }
        proto {
            srcDirs = [protocolSources.get().asFile]
        }
        resources {
            srcDirs = ["src/main/resources"]
        }
        output.resourcesDir = file(project.buildDir.absolutePath + "/classes")

    }
    test {
        java {
            srcDirs = ["src/test/java"]
        }
        resources {
            srcDirs = ["src/test/resources"]
        }
        output.resourcesDir = file(project.buildDir.absolutePath + "/test-classes")
    }
}

delombok {
    dependsOn(':plugins:prism-interface:generateProto')
    dependsOn(':plugins:sql-language:processResources')
    dependsOn(':plugins:mql-language:processResources')
}

compileJava {
    dependsOn(":core:processResources")
}

extractIncludeProto {
    dependsOn(':core:generateVersionProperties')
    dependsOn(':core:compileJava')
    dependsOn(':dbms:compileJava')
    dependsOn(':plugins:sql-language:compileJava')
    dependsOn(':plugins:mql-language:compileJava')
}


/**
 * Tests
 */
test {
    maxHeapSize = "2g" // Increase heap size (default is 512MB)
}

/**
 * JARs
 */
jar {
    manifest {
        attributes "Manifest-Version": "1.0"
        attributes "Copyright": "The Polypheny Project (polypheny.org)"
        attributes "Version": "$project.version"
    }
}

java {
    withJavadocJar()
    withSourcesJar()
    sourcesJar.dependsOn(generateProto)
}


/**
 * LICENSEE
 */
licensee {
    allow('MIT')
    allow('Apache-2.0')
    allow('BSD-3-Clause')
}
